type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.apache.commons.collections.MigrateRelocatedDeprecatedTypes
displayName: Migrate deprecated root package types to their Commons Collections 4 subpackage
description: >-
  Commons Collections 4 removed deprecated types from the root package whose replacements live in a subpackage, such
  as `org.apache.commons.collections.ReferenceMap` which becomes `org.apache.commons.collections4.map.ReferenceMap`.
tags:
  - apache
  - commons
  - collections
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.commons.collections.DefaultMapEntry
      newFullyQualifiedTypeName: org.apache.commons.collections4.keyvalue.DefaultMapEntry
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.commons.collections.HashBag
      newFullyQualifiedTypeName: org.apache.commons.collections4.bag.HashBag
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.commons.collections.ReferenceMap
      newFullyQualifiedTypeName: org.apache.commons.collections4.map.ReferenceMap
