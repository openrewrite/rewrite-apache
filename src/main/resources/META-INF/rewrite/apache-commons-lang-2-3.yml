########################################################################################################################
# Apache Commons Lang
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.apache.commons.lang.UpgradeApacheCommonsLang_2_3
displayName: Migrates to Apache Commons Lang 3.x
description: >-
  Migrate applications to the latest Apache Commons Lang 3.x release. This recipe modifies
  application's build files, and changes the package as per [the migration release notes](https://commons.apache.org/proper/commons-lang/article3_0.html).
tags:
  - apache
  - commons
  - lang
recipeList:
  - org.openrewrite.apache.commons.lang.UpgradeGradleCommonsLangVersionVariables
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: commons-lang
      oldArtifactId: commons-lang
      newGroupId: org.apache.commons
      newArtifactId: commons-lang3
      newVersion: 3.x
  - org.openrewrite.java.AddLiteralMethodArgument:
      methodPattern: org.apache.commons.lang.ClassUtils isAssignable(Class, Class)
      argumentIndex: 2
      literal: false
      primitiveType: boolean
  - org.openrewrite.java.AddLiteralMethodArgument:
      methodPattern: org.apache.commons.lang.ClassUtils isAssignable(Class[], Class[])
      argumentIndex: 2
      literal: false
      primitiveType: boolean
  - org.openrewrite.apache.commons.lang.WordUtilsToCommonsText
  # Commons Lang 3 deprecates StringEscapeUtils in favor of Commons Text, which has the Writer variants it dropped
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.apache.commons
      artifactId: commons-text
      version: 1.x
      onlyIfUsing: org.apache.commons.lang.StringEscapeUtils
      acceptTransitive: true
  # Commons Lang 2 is often only transitive, so ChangeDependency has nothing to change
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.apache.commons
      artifactId: commons-lang3
      version: 3.x
      onlyIfUsing: org.apache.commons.lang..*
      acceptTransitive: false
  # Commons Lang 3 has no `enums` package, so leave those types alone rather than invent a package
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.apache.commons.lang
      newPackageName: org.apache.commons.lang3
      recursive: false
  - org.openrewrite.apache.commons.lang.FindCommonsLangEnums
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.apache.commons.lang.builder
      newPackageName: org.apache.commons.lang3.builder
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.apache.commons.lang.exception
      newPackageName: org.apache.commons.lang3.exception
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.apache.commons.lang.math
      newPackageName: org.apache.commons.lang3.math
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.apache.commons.lang.mutable
      newPackageName: org.apache.commons.lang3.mutable
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.apache.commons.lang.reflect
      newPackageName: org.apache.commons.lang3.reflect
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.apache.commons.lang.text
      newPackageName: org.apache.commons.lang3.text
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.apache.commons.lang.time
      newPackageName: org.apache.commons.lang3.time
      recursive: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.commons.lang3.exception.ExceptionUtils getFullStackTrace(..)
      newMethodName: getStackTrace
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.commons.lang3.NullArgumentException
      newFullyQualifiedTypeName: java.lang.NullPointerException
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.commons.lang3.exception.NestableException
      newFullyQualifiedTypeName: java.lang.Exception
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.commons.lang3.exception.NestableRuntimeException
      newFullyQualifiedTypeName: java.lang.RuntimeException
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.commons.lang3.exception.NestableError
      newFullyQualifiedTypeName: java.lang.Error
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.commons.lang3.NumberUtils
      newFullyQualifiedTypeName: org.apache.commons.lang3.math.NumberUtils
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.commons.lang3.math.RandomUtils
      newFullyQualifiedTypeName: org.apache.commons.lang3.RandomUtils
  # Commons Lang 2 nextInt(int) draws below the bound; Lang 3 takes the lower bound too
  - org.openrewrite.java.AddLiteralMethodArgument:
      methodPattern: org.apache.commons.lang3.RandomUtils nextInt(int)
      argumentIndex: 0
      literal: 0
      primitiveType: int
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.commons.lang3.math.NumberUtils stringToInt(..)
      newMethodName: toInt
  - org.openrewrite.java.ChangeMethodTargetToStatic:
      methodPattern: org.apache.commons.lang3.BooleanUtils toBooleanObject(boolean)
      fullyQualifiedTargetTypeName: java.lang.Boolean
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: java.lang.Boolean toBooleanObject(boolean)
      newMethodName: valueOf
  - org.openrewrite.java.ChangeMethodTargetToStatic:
      methodPattern: org.apache.commons.lang3.ObjectUtils toString(Object, String)
      fullyQualifiedTargetTypeName: java.util.Objects
  # escapeSql was removed from Commons Lang 3, and only ever doubled single quotes
  - org.openrewrite.java.ChangeMethodTargetToStatic:
      methodPattern: org.apache.commons.lang3.StringEscapeUtils escapeSql(String)
      fullyQualifiedTargetTypeName: org.apache.commons.lang3.StringUtils
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.commons.lang3.StringUtils escapeSql(String)
      newMethodName: replace
  - org.openrewrite.java.AddLiteralMethodArgument:
      methodPattern: org.apache.commons.lang3.StringUtils replace(String)
      argumentIndex: 1
      literal: "'"
      primitiveType: String
  - org.openrewrite.java.AddLiteralMethodArgument:
      methodPattern: org.apache.commons.lang3.StringUtils replace(String, String)
      argumentIndex: 2
      literal: "''"
      primitiveType: String
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.commons.lang3.StringEscapeUtils escapeHtml(String)
      newMethodName: escapeHtml4
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.commons.lang3.StringEscapeUtils unescapeHtml(String)
      newMethodName: unescapeHtml4
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.commons.lang3.StringEscapeUtils escapeJavaScript(String)
      newMethodName: escapeEcmaScript
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.commons.lang3.StringEscapeUtils unescapeJavaScript(String)
      newMethodName: unescapeEcmaScript
  - org.openrewrite.apache.commons.lang.StringEscapeUtilsWriterMethodsToCommonsText
  - org.openrewrite.apache.commons.lang.SystemUtilsIsJavaVersionAtLeastToJavaVersion
  - org.openrewrite.apache.commons.lang3.MigrateSystemUtilsDeprecations
  - org.openrewrite.apache.commons.lang3.UseStandardCharsets
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.apache.commons.lang.WordUtilsToCommonsText
displayName: Migrate `WordUtils` to Apache Commons Text
description: Migrate `org.apache.commons.lang.WordUtils` to `org.apache.commons.text.WordUtils` and add the Commons Text dependency.
tags:
  - apache
  - commons
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.apache.commons
      artifactId: commons-text
      version: 1.x
      onlyIfUsing: org.apache.commons.lang.WordUtils
      acceptTransitive: true
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.apache.commons
      artifactId: commons-text
      version: 1.x
      onlyIfUsing: org.apache.commons.lang.text.*
      acceptTransitive: true
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.apache.commons
      artifactId: commons-text
      version: 1.x
      onlyIfUsing: org.apache.commons.lang3.text.*
      acceptTransitive: true
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.commons.lang.WordUtils
      newFullyQualifiedTypeName: org.apache.commons.text.WordUtils
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.apache.commons.lang.text
      newPackageName: org.apache.commons.text
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.apache.commons.lang3.text
      newPackageName: org.apache.commons.text
      recursive: true
  - org.openrewrite.apache.commons.lang.ParameterizeRawStrLookupSubclasses
