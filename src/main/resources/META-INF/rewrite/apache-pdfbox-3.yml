  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.xmpbox.XMPMetadata createAndAddPFAIdentificationSchema()
      newMethodName: createAndAddPDFAIdentificationSchema
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.xmpbox.XMPMetadata getPDFIdentificationSchema()
      newMethodName: getPDFAIdentificationSchema
